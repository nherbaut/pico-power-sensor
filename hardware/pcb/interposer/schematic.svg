<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="#f8fafc"/><g font-family="sans-serif" fill="#172536">
<text x="35" y="40" font-size="25">PicoPower — power and measurement boundary</text>
<text x="35" y="68" font-size="16" fill="#b45309">Review diagram; editable electrical schematic is interposer.kicad_sch</text>
<rect x="40" y="150" width="180" height="100" rx="7" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="130" y="185" text-anchor="middle" font-size="17">J1 / Korad</text>
<text x="130" y="215" text-anchor="middle" font-size="14">5.1 V input</text>
<path d="M220 200 H240" stroke="#dc2626" stroke-width="3"/>
<rect x="240" y="150" width="180" height="100" rx="7" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="330" y="185" text-anchor="middle" font-size="17">F1</text>
<text x="330" y="215" text-anchor="middle" font-size="14">replaceable fuse</text>
<path d="M420 200 H440" stroke="#dc2626" stroke-width="3"/>
<rect x="440" y="150" width="180" height="100" rx="7" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="530" y="185" text-anchor="middle" font-size="17">U1 + Q1/Q2</text>
<text x="530" y="215" text-anchor="middle" font-size="14">protection switch</text>
<path d="M620 200 H640" stroke="#dc2626" stroke-width="3"/>
<rect x="650" y="150" width="180" height="100" rx="7" fill="#fff" stroke="#334155" stroke-width="2"/>
<text x="740" y="185" text-anchor="middle" font-size="17">RSH1</text>
<text x="740" y="215" text-anchor="middle" font-size="14">5 mΩ Kelvin shunt</text>
