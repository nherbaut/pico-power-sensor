<text x="28" y="495" class="label">Solid module outline = visible face; dashed outline = opposite face projected through the board.</text>
<text x="28" y="521" class="small">All through-hole pad centres appear on both faces. Yellow: mounting hardware; red: inherited antenna keepout.</text>
<text x="28" y="547" class="small">Closest SD/monitor header centres: 5.569 mm. Actual sockets, solder access and Z clearances remain unverified.</text>
<text x="28" y="573" class="small">Card projects toward the north edge; actual card overhang, finger access and bench-support depth still require review.</text>
